<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Library — I want to read</title>

  <!-- Primary Meta Tags -->
  <meta name="title" content="I want to read — Free Book Search">
  <meta name="description" content="Search millions of free books online. Find any book by title, author or ISBN. Powered by Open Library. Read more, learn more.">
  <meta name="keywords" content="free books, open library, book search, read online, ebooks, vitabu bure">
  <meta name="author" content="Open Library Search">
  <meta name="robots" content="index, follow">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://YOUR-SITE-URL.vercel.app/">
  <meta property="og:title" content="I want to read — Free Book Search">
  <meta property="og:description" content="Search millions of free books online. Find any book by title, author or ISBN.">
  <meta property="og:image" content="https://YOUR-SITE-URL.vercel.app/screenshot.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://YOUR-SITE-URL.vercel.app/">
  <meta name="twitter:title" content="I want to read — Free Book Search">
  <meta name="twitter:description" content="Search millions of free books online. Find any book by title, author or ISBN.">
  <meta name="twitter:image" content="https://YOUR-SITE-URL.vercel.app/screenshot.png">

  <!-- Favicon (optional) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <!-- ===== GOOGLE ADSENSE ===== -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9516661142646014"
       crossorigin="anonymous"></script>
</head>
<body>
  <!-- Ambient orbs -->
  <div class="orb orb-purple"></div>
  <div class="orb orb-blue"></div>
  <div class="orb orb-green"></div>

  <!-- ═══ HERO ═══ -->
  <section class="hero" id="hero">
    <div class="topic-cloud" id="topic-cloud" aria-hidden="true"></div>

    <div class="headline-wrap">
      <h1 class="headline">I want to <em>read</em></h1>
      <p class="sub">Millions of books · Free · Never Pay</p>
    </div>

    <form class="search-wrap" id="search-form" autocomplete="off">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search any book, author, ISBN…" aria-label="Search books" />
        <button type="submit" id="search-btn">
          <span class="btn-text">Search</span>
          <span class="btn-loader" hidden></span>
        </button>
      </div>
    </form>

    <div class="chips-section">
      <p class="chips-label">Popular</p>
      <div class="chips" id="chips">
        <button class="chip c-purple" data-q="Harry Potter">Harry Potter</button>
        <button class="chip c-blue" data-q="1984">1984</button>
        <button class="chip c-green" data-q="Atomic Habits">Atomic Habits</button>
        <button class="chip c-purple" data-q="Ngugi wa Thiong'o">Ngũgĩ wa Thiong'o</button>
        <button class="chip c-blue" data-q="Sapiens">Sapiens</button>
        <button class="chip c-green" data-q="The Alchemist">The Alchemist</button>
        <button class="chip c-purple" data-q="Pride and Prejudice">Pride &amp; Prejudice</button>
        <button class="chip c-blue" data-q="Dune">Dune</button>
      </div>
    </div>
  </section>

  <!-- ===== AD BANNER ===== -->
  <div class="ad-banner" id="ad-banner" style="min-height:90px;width:100%;">
    <span class="ad-label">Ad</span>
    <div class="ad-slot" style="min-height:90px;width:100%;">
      <ins class="adsbygoogle"
           style="display:block;min-height:90px;"
           data-ad-client="ca-pub-9516661142646014"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
  </div>

  <!-- ═══ RESULTS ═══ -->
  <section class="results-section" id="results-section" hidden>
    <div class="results-header">
      <h2 class="results-title">Results</h2>
      <span class="results-count" id="results-count"></span>
    </div>
    <div id="status"></div>
    <div class="results-grid" id="results"></div>

    <div class="load-more-wrap" id="load-more-wrap" hidden>
      <button class="load-more-btn" id="load-more-btn">
        <span>Show more</span>
      </button>
    </div>
  </section>

  <!-- ===== INLINE AD ===== -->
  <div class="ad-inline" id="ad-inline" style="min-height:100px;width:100%;">
    <div class="ad-inline-inner">
      <span class="ad-label">Ad</span>
      <div class="ad-slot" style="min-height:90px;width:100%;">
        <ins class="adsbygoogle"
             style="display:block;min-height:90px;"
             data-ad-client="ca-pub-9516661142646014"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
             (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Open with <a href="https://openlibrary.org" target="_blank" rel="noopener">Open Library</a> · Free &amp; open data</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
